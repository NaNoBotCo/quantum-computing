name: Weekly refresh

# Monday 06:17 UTC: fetch the week's papers and news, rebuild the site, commit docs/.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pillow
      - run: python3 tools/fetch_recent.py
      - run: ./publish.sh
      - name: commit
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data/recent.json docs
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "weekly refresh: $(date -u +%Y-%m-%d)"
          git push
